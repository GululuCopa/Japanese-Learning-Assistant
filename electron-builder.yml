appId: com.japaneselearning.assistant
productName: Japanese Learning Assistant
copyright: Copyright © 2026 Japanese Learning Assistant
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
asarUnpack:
  - '**/*.node'
  - '**/better-sqlite3/**'
# better-sqlite3 13 ships N-API prebuilds; rebuilding from source cannot
# cross-compile Windows natives on macOS and is unnecessary for Electron 44.
npmRebuild: false
electronLanguages:
  - en-US
  - zh-CN
  - ja
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: dir
      arch:
        - x64
  artifactName: '${productName}-${version}-win-${arch}.${ext}'
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Japanese Learning Assistant
  uninstallDisplayName: Japanese Learning Assistant
  artifactName: '${productName}-${version}-setup-${arch}.${ext}'
mac:
  identity: null
  target:
    - target: dir
      arch:
        - arm64
linux:
  target:
    - dir
forceCodeSigning: false
publish: null
